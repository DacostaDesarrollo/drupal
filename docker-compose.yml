version: '3.8'

services:
  db:
    image: mysql:5.7
    container_name: drupal_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupaluser
      MYSQL_PASSWORD: drupalpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - drupal_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: drupal_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - drupal_network

  drupal:
    build: .
    container_name: drupal_app
    volumes:
      - .:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: drupal
      MYSQL_USER: drupaluser
      MYSQL_PASSWORD: drupalpassword
      COMPOSER_ALLOW_SUPERUSER: 1  # Evita errores de permisos con Composer
    depends_on:
      - db
    networks:
      - drupal_network

  nginx:
    image: nginx:1.21
    container_name: drupal_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - .:/var/www/html
    depends_on:
      - drupal
    networks:
      - drupal_network

volumes:
  db_data:

networks:
  drupal_network:
    driver: bridge
